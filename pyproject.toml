[project]
name = "cao-setu-v2"
version = "0.1.0"
description = "SETU Inquiry Pay Equity (Gelijkwaardig Belonen): Python-model, SETU-JSON en upload voor wijzerbelonen"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.15.1",
    "jsonschema>=4.26.0",
    "marker-pdf>=2.0.0",
    "mistralai>=2.10.1",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
]

[project.scripts]
cao-setu-v2 = "cao_setu_v2:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mini-racer>=0.14.1",
    "pytest>=9.1.1",
]
